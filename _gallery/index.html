<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template Index — Henrique Roquete Cacao</title>
  <meta name="description" content="Index of AI-assisted website templates by Henrique Roquete Cacao." />
  <meta name="theme-color" content="#0E0E10" />
  <!-- Deliberately quiet: this page is just the doorway to the templates.
       The portfolio site is the real showcase; it reads /templates.json too. -->
  <style>
    :root {
      --bg: #0E0E10; --panel: #17171B; --line: #2A2A31; --ink: #F2F1EE; --muted: #9A99A3; --accent: #E8FF5A;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
    a { color: inherit; }
    .wrap { width: min(100% - 32px, 1160px); margin-inline: auto; }
    header { padding: 64px 0 40px; border-bottom: 1px solid var(--line); }
    .kicker { font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1; letter-spacing: -.03em; margin: 14px 0 16px; font-weight: 700; }
    h1 span { color: var(--accent); }
    header p { color: var(--muted); max-width: 56ch; margin: 0; }
    .count { font: 13px var(--mono); color: var(--muted); padding: 22px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding-bottom: 80px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
    .card:hover { border-color: #44444D; transform: translateY(-3px); }
    .thumb { aspect-ratio: 16 / 10; background: #222 center / cover no-repeat; display: block; border-bottom: 1px solid var(--line); }
    .body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h2 { margin: 0; font-size: 1.25rem; letter-spacing: -.01em; }
    .date { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
    .sub { color: var(--muted); margin: -6px 0 0; font-size: .95rem; }
    .desc { margin: 0; font-size: .95rem; color: #CFCED6; flex: 1; }
    .palette { display: flex; gap: 6px; }
    .palette i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span { font: 11px var(--mono); padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
    .concept { font: 11px var(--mono); color: var(--accent); }
    .links { display: flex; gap: 10px; margin-top: 4px; }
    .links a { font: 13px var(--mono); text-decoration: none; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
    .links a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .links a:hover { border-color: var(--accent); }
    .empty { color: var(--muted); font: 14px var(--mono); padding: 40px 0; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font: 12px var(--mono); }
  </style>
</head>
<body>
  <header class="wrap">
    <p class="kicker">Template index</p>
    <h1>Websites, built with <span>AI</span>.</h1>
    <p>A growing set of website templates I designed and built with AI tools. Each one is a standalone live site, and the code is open to read.</p>
  </header>
  <main class="wrap">
    <p class="count" id="count">Loading…</p>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="wrap">Henrique Roquete Cacao · Global Design, IADE</footer>

  <script>
    // Renders cards from the same manifest the portfolio uses.
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    fetch('templates.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(({ templates }) => {
        document.getElementById('count').textContent = `${templates.length} template${templates.length === 1 ? '' : 's'}`;
        if (!templates.length) { document.getElementById('grid').innerHTML = '<p class="empty">No templates yet.</p>'; return; }
        document.getElementById('grid').innerHTML = templates.map(t => `
          <article class="card">
            <a class="thumb" href="${esc(t.url)}" aria-label="Open ${esc(t.title)}" style="${t.thumbnail ? `background-image:url('${esc(t.thumbnail)}')` : ''}"></a>
            <div class="body">
              <div class="top"><h2>${esc(t.title)}</h2><span class="date">${esc(t.date)}</span></div>
              ${t.subtitle ? `<p class="sub">${esc(t.subtitle)}</p>` : ''}
              <p class="desc">${esc(t.description)}</p>
              ${t.palette ? `<div class="palette">${t.palette.map(c => `<i style="background:${esc(c)}"></i>`).join('')}</div>` : ''}
              ${t.tags ? `<div class="tags">${t.tags.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
              ${t.concept ? `<p class="concept">${esc(t.conceptNote || 'Unofficial concept')}</p>` : ''}
              <div class="links">
                <a class="primary" href="${esc(t.url)}">Open live ↗</a>
                ${t.source ? `<a href="${esc(t.source)}">Code</a>` : ''}
              </div>
            </div>
          </article>`).join('');
      })
      .catch(() => { document.getElementById('count').textContent = 'Could not load templates.json'; });
  </script>
</body>
</html>
